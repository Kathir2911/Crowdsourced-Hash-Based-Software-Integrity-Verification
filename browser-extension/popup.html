<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hash Verification</title>
    <style>
        body {
            width: 400px;
            min-height: 300px;
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            line-height: 1.4;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .logo {
            width: 48px;
            height: 48px;
            margin: 0 auto 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 20px;
        }
        
        h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
            color: #1a1a1a;
        }
        
        .subtitle {
            color: #666;
            font-size: 12px;
            margin-top: 4px;
        }
        
        .file-selection {
            margin-bottom: 20px;
        }
        
        .file-input-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }
        
        .file-input {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        
        .file-button {
            display: block;
            width: 100%;
            padding: 12px 16px;
            background: #f8f9fa;
            border: 2px dashed #dee2e6;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .file-button:hover {
            background: #e9ecef;
            border-color: #adb5bd;
        }
        
        .file-button.active {
            background: #e3f2fd;
            border-color: #2196f3;
            color: #1976d2;
        }
        
        .status-display {
            margin-top: 16px;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            display: none;
        }
        
        .status-verified {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status-tampered {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status-suspicious {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        
        .status-unknown {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        
        .status-loading {
            background: #e2e3e5;
            color: #383d41;
            border: 1px solid #d6d8db;
        }
        
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e9ecef;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 8px;
        }
        
        .progress-fill {
            height: 100%;
            background: #007bff;
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .file-info {
            margin-top: 12px;
            font-size: 12px;
            color: #666;
        }
        
        .error-message {
            color: #dc3545;
            font-size: 12px;
            margin-top: 8px;
        }
        
        .settings-link {
            text-align: center;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #e9ecef;
        }
        
        .settings-link a {
            color: #6c757d;
            text-decoration: none;
            font-size: 12px;
        }
        
        .settings-link a:hover {
            color: #495057;
            text-decoration: underline;
        }
        
        /* Warning Dialog Styles */
        .warning-dialog {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
        }
        
        .warning-dialog-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
        }
        
        .warning-dialog-content {
            position: relative;
            background: white;
            margin: 20px;
            padding: 20px;
            border-radius: 8px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .warning-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid #f5c6cb;
        }
        
        .warning-header.caution {
            border-bottom-color: #ffeaa7;
        }
        
        .warning-header.service-unavailable {
            border-bottom-color: #d6d8db;
        }
        
        .warning-header h3 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            color: #721c24;
        }
        
        .warning-header.caution h3 {
            color: #856404;
        }
        
        .warning-header.service-unavailable h3 {
            color: #383d41;
        }
        
        .warning-icon {
            font-size: 24px;
        }
        
        .warning-body {
            font-size: 13px;
            line-height: 1.5;
        }
        
        .warning-body p {
            margin: 8px 0;
        }
        
        .warning-explanation,
        .warning-recommendations {
            margin: 16px 0;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 6px;
        }
        
        .warning-explanation h4,
        .warning-recommendations h4 {
            margin: 0 0 8px 0;
            font-size: 14px;
            font-weight: 600;
            color: #495057;
        }
        
        .warning-body ul {
            margin: 8px 0;
            padding-left: 20px;
        }
        
        .warning-body li {
            margin: 6px 0;
        }
        
        .warning-note {
            margin-top: 16px;
            padding: 12px;
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            border-radius: 4px;
            font-size: 12px;
        }
        
        .warning-dialog-actions {
            margin-top: 16px;
            text-align: right;
        }
        
        .warning-close-btn {
            padding: 8px 16px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }
        
        .warning-close-btn:hover {
            background: #5a6268;
        }
        
        /* Notification Styles */
        .notification-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            font-size: 16px;
            font-weight: 600;
        }
        
        .notification-icon {
            font-size: 20px;
        }
        
        .notification-body {
            font-size: 13px;
        }
        
        .notification-field {
            margin: 6px 0;
        }
        
        .notification-message {
            margin: 12px 0;
            padding: 8px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 4px;
            font-style: italic;
        }
        
        .notification-action {
            margin: 12px 0;
            padding: 8px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 4px;
            border-left: 3px solid currentColor;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">🔒</div>
        <h1>Hash Verification</h1>
        <div class="subtitle">Crowdsourced integrity checking</div>
    </div>
    
    <div class="file-selection">
        <div class="file-input-wrapper">
            <input type="file" id="fileInput" class="file-input" accept=".exe,.msi,.dmg,.deb,.rpm,.appimage">
            <label for="fileInput" class="file-button" id="fileButton">
                <div>📁 Select File to Verify</div>
                <div style="font-size: 11px; color: #666; margin-top: 4px;">
                    Supports: .exe, .msi, .dmg, .deb, .rpm, .appimage
                </div>
            </label>
        </div>
    </div>
    
    <div id="statusDisplay" class="status-display">
        <div id="statusText"></div>
        <div id="progressBar" class="progress-bar" style="display: none;">
            <div id="progressFill" class="progress-fill"></div>
        </div>
        <div id="fileInfo" class="file-info"></div>
        <div id="errorMessage" class="error-message"></div>
    </div>
    
    <div class="settings-link">
        <a href="#" id="settingsLink">Settings & Configuration</a>
    </div>
    
    <!-- Warning Dialog Modal -->
    <div id="warningDialog" class="warning-dialog" style="display: none;">
        <div class="warning-dialog-overlay"></div>
        <div class="warning-dialog-content">
            <div id="warningContent"></div>
            <div class="warning-dialog-actions">
                <button id="closeWarningBtn" class="warning-close-btn">Close</button>
            </div>
        </div>
    </div>
    
    <script src="dist/popup.js"></script>
</body>
</html>
