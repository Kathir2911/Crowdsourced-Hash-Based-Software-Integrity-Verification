name: Auto Generate Diagrams

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-diagrams:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Simple Diagram
        run: |
          mkdir -p docs
          echo "# Auto Generated Diagram" > docs/diagram.md

      - name: Commit Files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add .

          git commit -m "Generated diagrams" || echo "No changes"

          git push