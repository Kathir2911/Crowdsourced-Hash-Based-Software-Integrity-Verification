spring:
  application:
    name: crowdsourced-hash-verification
  
  datasource:
    url: jdbc:postgresql://localhost:5432/crowdsourced_hash_verification
    username: ${DB_USERNAME:hashverify}
    password: ${DB_PASSWORD:hashverify123}
    driver-class-name: org.postgresql.Driver
    
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    
  security:
    user:
      name: admin
      password: ${ADMIN_PASSWORD:admin123}
      roles: ADMIN

server:
  port: 8080
  servlet:
    context-path: /api/v1
  compression:
    enabled: true
  http2:
    enabled: true

# Application Configuration
app:
  consensus:
    threshold-percentage: 0.70
    minimum-submissions: 3
    confidence-high-threshold: 0.80
    confidence-minimum-submissions: 10
    cache-ttl-hours: 24
    
  retention:
    submission-ttl-days: 90
    
  performance:
    max-concurrent-requests: 1000
    api-timeout-seconds: 30
    hash-computation-timeout-seconds: 60
    
  rate-limiting:
    submissions-per-ip-per-hour: 100
    verifications-per-ip-per-minute: 60
    admin-api-requests-per-minute: 1000
    
  security:
    require-https: true
    cors-allowed-origins: 
      - "chrome-extension://*"
      - "moz-extension://*"
    admin-api-key-length: 32
    admin-api-key: ${ADMIN_API_KEY:dev-admin-key-change-in-production-12345678}
    
  replay-protection:
    time-window-hours: 24
    hash-algorithm: "SHA-256"

# Logging Configuration
logging:
  level:
    com.hashverify: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/hash-verification.log

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev
      
  datasource:
    url: jdbc:postgresql://localhost:5432/crowdsourced_hash_verification_dev
    
  jpa:
    show-sql: true
    
  security:
    user:
      password: dev123

app:
  security:
    require-https: false
    
logging:
  level:
    com.hashverify: DEBUG
    org.springframework.web: DEBUG

---
# Test Profile  
spring:
  config:
    activate:
      on-profile: test
      
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
    
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    
  flyway:
    enabled: false

app:
  security:
    require-https: false
  rate-limiting:
    submissions-per-ip-per-hour: 1000
    verifications-per-ip-per-minute: 1000