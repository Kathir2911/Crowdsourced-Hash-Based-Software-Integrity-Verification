spring:
  datasource:
    url: jdbc:tc:postgresql:15-alpine:///testdb
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false

logging:
  level:
    com.hashverify: DEBUG
    org.testcontainers: INFO

app:
  retention:
    submission-ttl-days: 90
  consensus:
    threshold-percentage: 0.70
    minimum-submissions: 3
    confidence-high-threshold: 0.80
    confidence-minimum-submissions: 10
